name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jev]"
      - name: Run the credential-free suite
        run: pytest -q
      - name: Prove the CLI works end to end
        run: |
          jev-pilot selftest
          jev-pilot bench --fixtures tests/fixtures/calc-frozen.json --chooser mock

  live-browser:
    name: live browser loop (chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run the live loop against a local fixture page
        env:
          # GitHub's runners need these; the browser surface takes extra flags from here.
          JEV_PILOT_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
        run: pytest -m live -q

  description-sync:
    name: README and the published description
    runs-on: ubuntu-latest
    # A warning, not a gate: documentation work should not be blocked, but a silent divergence
    # between the repository and the PyPI page is worth an annotation on every push.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does the README differ from the newest release without a version bump?
        run: bash scripts/check-description-sync.sh
